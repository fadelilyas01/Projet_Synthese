services:
  # -------------------------------------------------------------
  # Base de données relationnelle PostgreSQL 16
  # -------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: shieldnet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shieldnet_db}
      POSTGRES_USER: ${POSTGRES_USER:-shieldnet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Durcissement réseau : liaison sur loopback 127.0.0.1 uniquement (fermé à l'Internet public)
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shieldnet_user -d shieldnet_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Serveur de cache & files d'attente Redis 7
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: shieldnet_redis
    restart: unless-stopped
    # Durcissement réseau : loopback local uniquement
    ports:
      - "127.0.0.1:6379:6379"

  # -------------------------------------------------------------
  # API REST Django (Gunicorn + DRF + Swagger)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./shieldnet_backend
      dockerfile: Dockerfile
    container_name: shieldnet_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./shieldnet_backend/.env
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-False}"
      SECRET_KEY: "${SECRET_KEY}"
      API_KEY: "${API_KEY}"
      HASH_SALT: "${HASH_SALT}"
      POSTGRES_DB: "${POSTGRES_DB:-shieldnet_db}"
      POSTGRES_USER: "${POSTGRES_USER:-shieldnet_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,api.shieldnet.app,admin.shieldnet.app}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@shieldnet.app}"
    # Durcissement réseau : liaison sur loopback 127.0.0.1 (reverse proxy Nginx / ALB requis)
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./shieldnet_backend:/app

volumes:
  postgres_data:
