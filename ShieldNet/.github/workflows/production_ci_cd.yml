name: ShieldNet CI/CD Pipeline

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-flutter:
    name: Flutter Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test --coverage

  test-django:
    name: Django Backend Tests & Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../shieldnet_backend/requirements.txt || true

      - name: Run Django Checks & Tests
        env:
          SECRET_KEY: "ci-cd-test-secret-key-must-be-very-long-and-secure-for-prod-validation-check-32chars"
          HASH_SALT: "ci-cd-test-hash-salt-value-strictly-64-hex-characters-0123456789abcdef0123456789abcdef"
          DJANGO_DEBUG: "False"
          API_KEY: "ci-cd-api-key-test-value-32chars"
        run: |
          cd ../shieldnet_backend
          python manage.py check
          python manage.py test

  build-android:
    name: Build Android App Bundle (.aab)
    needs: [test-flutter, test-django]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shieldnet-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
