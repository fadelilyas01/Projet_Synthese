version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: shieldnet_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shieldnet}
      POSTGRES_USER: ${POSTGRES_USER:-shieldnet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shieldnet_user} -d ${POSTGRES_DB:-shieldnet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shieldnet_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shieldnet_backend_app
    restart: always
    env_file:
      - .env
    environment:
      - DJANGO_DEBUG=False
      - DATABASE_URL=postgres://${POSTGRES_USER:-shieldnet_user}:${POSTGRES_PASSWORD:-change_me_in_prod}@db:5432/${POSTGRES_DB:-shieldnet}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    container_name: shieldnet_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
